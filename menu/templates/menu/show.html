<h1>商品: {{ menu.name }}</h1>
<h1>價格: {{ menu.price }}</h1>
<h1>描述: {{ menu.description }}</h1>
<h1>是否提供: {{ menu.is_available }}</h1>
<h1>辣？: {{ menu.is_spicy }}</h1>


<a href="{% url 'menu:index' %}">返回商品列表</a>

<a href="{% url 'menu:update' menu.id %}">修改</a>

<form action="{% url 'menu:delete' menu.id %}" method="post" onsubmit="return confirm('確定要刪除嗎？')">
    {% csrf_token %}
    <button>刪除</button>
</form>
